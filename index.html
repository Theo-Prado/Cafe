<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canelinha Cafe • Digital Kiosk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #120b08;
      --panel: rgba(36, 22, 15, 0.8);
      --panel-strong: #2d1a11;
      --text: #f9efe3;
      --muted: #c8a98f;
      --accent: #f2bb65;
      --accent-2: #e1913a;
      --ok: #8ed29a;
      --warn: #ffad7a;
      --danger: #ff8b8b;
      --line: rgba(242, 187, 101, 0.2);
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, #3a2217 0, transparent 35%),
        radial-gradient(circle at 80% 0%, #2a1710 0, transparent 35%),
        linear-gradient(160deg, #120b08 0%, #1d110c 50%, #110a07 100%);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .app {
      width: min(980px, 100%);
      background: linear-gradient(160deg, rgba(45, 26, 17, 0.95), rgba(28, 16, 11, 0.95));
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .top {
      padding: 24px 28px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      align-items: center;
    }

    .brand h1 {
      font-family: "Playfair Display", serif;
      margin: 0;
      letter-spacing: 1px;
      font-size: clamp(1.5rem, 2.8vw, 2.1rem);
      color: #ffd89e;
    }

    .brand p { margin: 4px 0 0; color: var(--muted); font-size: .92rem; }
    .status { display: flex; gap: 10px; flex-wrap: wrap; }
    .pill { padding: 7px 12px; border-radius: 999px; font-size: .82rem; border: 1px solid var(--line); background: rgba(255,255,255,.03); }

    .layout { display: grid; grid-template-columns: 1.45fr .95fr; }

    .section { padding: 22px 24px; }
    .section + .section { border-left: 1px solid var(--line); }

    .hello {
      background: rgba(242, 187, 101, .08);
      border: 1px solid rgba(242, 187, 101, .2);
      color: #ffe2bb;
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 16px;
      font-size: .93rem;
    }

    .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px,1fr)); gap: 12px; }
    .card {
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 14px;
      padding: 14px;
      transition: .2s ease;
    }
    .card:hover { border-color: rgba(242, 187, 101, .45); transform: translateY(-2px); }
    .name { font-weight: 600; text-transform: capitalize; }
    .meta { color: var(--muted); font-size: .86rem; margin-top: 4px; }

    .row { display: flex; gap: 8px; margin-top: 10px; }
    input, button {
      font: inherit;
      border-radius: 10px;
      border: 1px solid transparent;
    }
    input {
      background: rgba(255,255,255,.06);
      color: var(--text);
      padding: 9px 10px;
      border-color: rgba(255,255,255,.12);
      width: 100%;
    }
    button {
      cursor: pointer;
      background: linear-gradient(140deg, var(--accent), var(--accent-2));
      color: #2d1708;
      font-weight: 700;
      padding: 9px 11px;
    }
    button.ghost {
      background: rgba(255,255,255,.04);
      color: #f8dcc1;
      border: 1px solid rgba(255,255,255,.1);
      font-weight: 500;
    }

    .controls { display: grid; gap: 10px; margin-top: 18px; }
    .controls .row button { flex: 1; }

    .cart-list { display: grid; gap: 8px; margin-bottom: 14px; max-height: 280px; overflow: auto; padding-right: 4px; }
    .cart-item { display: flex; justify-content: space-between; font-size: .93rem; padding: 10px; border-radius: 10px; background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.07); }

    .totals { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 6px; }
    .totals div { display: flex; justify-content: space-between; color: var(--muted); }
    .totals .final { color: #ffe2bb; font-size: 1.06rem; font-weight: 700; }

    .forms { margin-top: 18px; display: grid; gap: 12px; }
    .box { border: 1px solid rgba(255,255,255,.1); border-radius: 12px; padding: 12px; background: rgba(255,255,255,.02); }
    .box h3 { margin: 0 0 8px; font-size: .95rem; color: #ffd9ab; }

    .message { margin-top: 12px; font-size: .9rem; min-height: 22px; color: var(--muted); }
    .ok { color: var(--ok); }
    .warn { color: var(--warn); }
    .err { color: var(--danger); }

    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
      .section + .section { border-left: 0; border-top: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="brand">
        <h1>☕ Canelinha Cafe</h1>
        <p>Since 1980 • Self-service kiosk inspired by the Python CLI flow</p>
      </div>
      <div class="status">
        <select class="pill" id="langSelect" aria-label="Language selector">
          <option value="en">English</option>
          <option value="pt-BR">Português (Brasil)</option>
        </select>
        <span class="pill" id="discountPill">Discount: OFF</span>
        <span class="pill" id="loginPill">Guest mode</span>
      </div>
    </header>

    <section class="layout">
      <div class="section">
        <div class="hello" id="welcome">Hello! Enter your name to start your order.</div>

        <div class="row" style="max-width:420px;margin-bottom:16px;">
          <input id="nameInput" placeholder="Enter your name" />
          <button id="setNameBtn">Start</button>
        </div>

        <h2 style="margin:0 0 10px;font-size:1rem;color:#ffd9ab;">Menu & Stock</h2>
        <div class="menu-grid" id="menuGrid"></div>

        <div class="controls">
          <div class="row">
            <button class="ghost" id="viewCartBtn">View Cart</button>
            <button class="ghost" id="finishBtn">Finish Order</button>
          </div>
          <div class="row">
            <input id="removeIndex" type="number" min="1" placeholder="Item # to remove" />
            <input id="removeQty" type="number" min="1" placeholder="Qty" />
            <button class="ghost" id="removeBtn">Remove</button>
          </div>
        </div>
      </div>

      <aside class="section">
        <h2 style="margin:0 0 10px;font-size:1rem;color:#ffd9ab;">Cart Summary</h2>
        <div class="cart-list" id="cartList"></div>
        <div class="totals">
          <div><span>Subtotal</span><strong id="subtotal">$ 0.00</strong></div>
          <div><span>Discount (10%)</span><strong id="discountValue">$ 0.00</strong></div>
          <div class="final"><span>Total</span><strong id="total">$ 0.00</strong></div>
        </div>

        <div class="forms">
          <div class="box">
            <h3>Register (applies discount)</h3>
            <input id="regUser" placeholder="Username" />
            <div class="row"><input id="regPass" type="password" placeholder="Password" /><input id="regConfirm" type="password" placeholder="Confirm" /></div>
            <input id="regCpf" placeholder="CPF (only digits or formatted)" />
            <div class="row"><button id="registerBtn" style="width:100%;">Register</button></div>
          </div>

          <div class="box">
            <h3>Login (user/admin)</h3>
            <input id="loginUser" placeholder="Username" />
            <div class="row"><input id="loginPass" type="password" placeholder="Password" /><button id="loginBtn">Login</button></div>
          </div>

          <div class="box" id="adminBox" style="display:none;">
            <h3>Admin Controls</h3>
            <div class="row"><input id="adminItem" type="number" min="1" placeholder="Item #" /><input id="adminValue" type="number" placeholder="Value" /></div>
            <div class="row" style="display:grid;grid-template-columns:1fr 1fr;">
              <button class="ghost" id="setStockBtn">Set stock</button>
              <button class="ghost" id="addStockBtn">Add stock</button>
              <button class="ghost" id="resetStockBtn">Reset stock</button>
              <button class="ghost" id="setPriceBtn">Set price</button>
            </div>
          </div>
        </div>

        <div class="message" id="msg"></div>
      </aside>
    </section>
  </main>

  <script>
    const i18n = {
      "en": {
        pageLang: "en",
        title: "Canelinha Cafe • Digital Kiosk",
        subtitle: "Since 1980 • Self-service kiosk inspired by the Python CLI flow",
        discount: "Discount",
        on: "ON",
        off: "OFF",
        guestMode: "Guest mode",
        helloStart: "Hello! Enter your name to start your order.",
        namePlaceholder: "Enter your name",
        startBtn: "Start",
        menuTitle: "Menu & Stock",
        price: "Price",
        stock: "Stock",
        add: "Add",
        viewCart: "View Cart",
        finishOrder: "Finish Order",
        removeItemPlaceholder: "Item # to remove",
        qtyPlaceholder: "Qty",
        remove: "Remove",
        cartTitle: "Cart Summary",
        subtotal: "Subtotal",
        discount10: "Discount (10%)",
        total: "Total",
      },
      "pt-BR": {
        pageLang: "pt-BR",
        title: "Canelinha Cafe • Totem Digital",
        subtitle: "Desde 1980 • Totem de autoatendimento inspirado no fluxo CLI em Python",
        discount: "Desconto",
        on: "ATIVO",
        off: "INATIVO",
        guestMode: "Modo convidado",
        helloStart: "Olá! Digite seu nome para começar seu pedido.",
        namePlaceholder: "Digite seu nome",
        startBtn: "Iniciar",
        menuTitle: "Cardápio e Estoque",
        price: "Preço",
        stock: "Estoque",
        add: "Adicionar",
        viewCart: "Ver carrinho",
        finishOrder: "Finalizar pedido",
        removeItemPlaceholder: "Item # para remover",
        qtyPlaceholder: "Qtd",
        remove: "Remover",
        cartTitle: "Resumo do carrinho",
        subtotal: "Subtotal",
        discount10: "Desconto (10%)",
        total: "Total",
      }
    };
    let currentLang = "en";

    const options = {
      "cappuccino": [12, 10],
      "frappuccino": [12, 10],
      "moccaccino": [12, 10],
      "macchiato": [12, 10],
      "latte": [10, 10],
      "espresso": [7, 10],
      "espresso latte": [9, 10]
    };
    const users = {};
    const cart = {};
    let discount = false;
    let customerName = "Guest";

    const el = id => document.getElementById(id);
    const fmt = n => `$ ${Number(n).toFixed(2)}`;
    const t = k => i18n[currentLang][k] || i18n.en[k] || k;

    function validateCPF(cpf) {
      cpf = cpf.replace(/[.\-\s]/g, "");
      if (cpf.length !== 11 || /^([0-9])\1+$/.test(cpf)) return false;
      let total = 0;
      for (let i = 0; i < 9; i++) total += Number(cpf[i]) * (10 - i);
      let digit1 = (total * 10) % 11;
      if (digit1 === 10) digit1 = 0;
      total = 0;
      for (let i = 0; i < 10; i++) total += Number(cpf[i]) * (11 - i);
      let digit2 = (total * 10) % 11;
      if (digit2 === 10) digit2 = 0;
      return digit1 === Number(cpf[9]) && digit2 === Number(cpf[10]);
    }

    function setMessage(text, cls = "") {
      el("msg").className = `message ${cls}`;
      el("msg").textContent = text;
    }

    function renderMenu() {
      el("menuGrid").innerHTML = "";
      Object.keys(options).forEach((coffee, idx) => {
        const [price, stock] = options[coffee];
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="name">${idx + 1}. ${coffee}</div>
          <div class="meta">${t("price")}: ${fmt(price)} • ${t("stock")}: ${stock}</div>
          <div class="row">
            <input type="number" min="1" value="1" id="qty-${idx}" />
            <button data-index="${idx}">${t("add")}</button>
          </div>
        `;
        card.querySelector("button").onclick = () => {
          const qty = Number(card.querySelector("input").value);
          addItem(idx, qty);
        };
        el("menuGrid").appendChild(card);
      });
    }

    function addItem(index, qty) {
      const keys = Object.keys(options);
      const coffee = keys[index];
      if (!coffee || qty <= 0) return setMessage("Invalid item or quantity.", "err");
      if (qty > options[coffee][1]) return setMessage("Insufficient stock!", "err");
      cart[coffee] = (cart[coffee] || 0) + qty;
      options[coffee][1] -= qty;
      setMessage("Item added!", "ok");
      renderAll();
    }

    function removeItem(itemNumber, qty) {
      const keys = Object.keys(options);
      const coffee = keys[itemNumber - 1];
      if (!coffee) return setMessage("Invalid item number.", "err");
      if (!(coffee in cart)) return setMessage("Item not in cart.", "warn");
      if (qty <= 0) return setMessage("Quantity must be greater than zero.", "err");
      if (qty >= cart[coffee]) {
        options[coffee][1] += cart[coffee];
        delete cart[coffee];
      } else {
        cart[coffee] -= qty;
        options[coffee][1] += qty;
      }
      setMessage("Item removed successfully!", "ok");
      renderAll();
    }

    function renderCart() {
      const list = el("cartList");
      list.innerHTML = "";
      let subtotal = 0;
      Object.entries(cart).forEach(([item, qty]) => {
        const sub = qty * options[item][0];
        subtotal += sub;
        const row = document.createElement("div");
        row.className = "cart-item";
        row.innerHTML = `<span>${item} × ${qty}</span><strong>${fmt(sub)}</strong>`;
        list.appendChild(row);
      });
      if (!Object.keys(cart).length) list.innerHTML = `<div class="cart-item">Cart is empty.</div>`;
      const disc = discount ? subtotal * 0.10 : 0;
      el("subtotal").textContent = fmt(subtotal);
      el("discountValue").textContent = fmt(disc);
      el("total").textContent = fmt(subtotal - disc);
    }

    function renderStatus() {
      el("discountPill").textContent = `${t("discount")}: ${discount ? t("on") : t("off")}`;
    }

    function renderLanguage() {
      document.documentElement.lang = i18n[currentLang].pageLang;
      document.title = t("title");
      document.querySelector(".brand p").textContent = t("subtitle");
      if (customerName === "Guest") el("welcome").textContent = t("helloStart");
      el("nameInput").placeholder = t("namePlaceholder");
      el("setNameBtn").textContent = t("startBtn");
      document.querySelector(".section h2").textContent = t("menuTitle");
      el("viewCartBtn").textContent = t("viewCart");
      el("finishBtn").textContent = t("finishOrder");
      el("removeIndex").placeholder = t("removeItemPlaceholder");
      el("removeQty").placeholder = t("qtyPlaceholder");
      el("removeBtn").textContent = t("remove");
      document.querySelector("aside.section h2").textContent = t("cartTitle");
      el("subtotal").previousElementSibling.textContent = t("subtotal");
      el("discountValue").previousElementSibling.textContent = t("discount10");
      el("total").previousElementSibling.textContent = t("total");
      if (el("loginPill").textContent === "Guest mode" || el("loginPill").textContent === "Modo convidado") {
        el("loginPill").textContent = t("guestMode");
      }
    }

    function renderAll() { renderLanguage(); renderMenu(); renderCart(); renderStatus(); }

    el("setNameBtn").onclick = () => {
      const v = el("nameInput").value.trim();
      if (!v) return setMessage("Please enter your name.", "warn");
      customerName = v;
      el("welcome").textContent = `Hello, ${customerName}! Welcome to Canelinha Cafe.`;
      setMessage("Name saved. Start building your order.", "ok");
    };

    el("registerBtn").onclick = () => {
      const u = el("regUser").value.trim();
      const p = el("regPass").value;
      const c = el("regConfirm").value;
      const cpf = el("regCpf").value.trim();
      if (!u) return setMessage("Username is required.", "err");
      if (users[u]) return setMessage("Username already exists.", "err");
      if (p !== c) return setMessage("Passwords do not match.", "err");
      if (!validateCPF(cpf)) return setMessage("Invalid CPF.", "err");
      users[u] = { password: p, cpf };
      discount = true;
      el("loginPill").textContent = `Registered: ${u}`;
      setMessage("Registration successful! Discount applied.", "ok");
      renderStatus(); renderCart();
    };

    el("loginBtn").onclick = () => {
      const u = el("loginUser").value.trim();
      const p = el("loginPass").value;
      if (u === "admin" && p === "admin@155") {
        el("adminBox").style.display = "block";
        el("loginPill").textContent = "Admin mode active";
        setMessage("ADMIN login successful!", "ok");
        return;
      }
      if (users[u] && users[u].password === p) {
        discount = true;
        el("loginPill").textContent = `Logged in: ${u}`;
        setMessage("Login successful!", "ok");
        renderStatus(); renderCart();
      } else {
        setMessage("Incorrect username or password.", "err");
      }
    };

    function adminUpdate(type) {
      const item = Number(el("adminItem").value);
      const value = Number(el("adminValue").value);
      const keys = Object.keys(options);
      const coffee = keys[item - 1];
      if (!coffee) return setMessage(`Invalid number. Choose between 1 and ${keys.length}.`, "err");
      if (type === "setStock") options[coffee][1] = value;
      if (type === "addStock") options[coffee][1] += value;
      if (type === "resetStock") options[coffee][1] = 0;
      if (type === "setPrice") {
        if (value <= 0) return setMessage("Price must be greater than zero.", "err");
        options[coffee][0] = value;
      }
      setMessage("Admin update applied.", "ok");
      renderAll();
    }

    el("setStockBtn").onclick = () => adminUpdate("setStock");
    el("addStockBtn").onclick = () => adminUpdate("addStock");
    el("resetStockBtn").onclick = () => adminUpdate("resetStock");
    el("setPriceBtn").onclick = () => adminUpdate("setPrice");

    el("removeBtn").onclick = () => removeItem(Number(el("removeIndex").value), Number(el("removeQty").value));
    el("viewCartBtn").onclick = () => { renderCart(); setMessage("Cart refreshed.", "ok"); };
    el("finishBtn").onclick = () => {
      renderCart();
      setMessage(`Thanks for your purchase, ${customerName}!`, "ok");
    };
    el("langSelect").onchange = e => {
      currentLang = e.target.value;
      renderAll();
    };

    renderAll();
  </script>
</body>
</html>
